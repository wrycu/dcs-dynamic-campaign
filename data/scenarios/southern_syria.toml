# The first scenario (roadmap D2: superpower vs minor country). Built on the Syria map layer,
# data/theaters/syria/map.json; objective ids are listed there. See docs/scenarios.md.
#
# Check it and draw it:  python3 -m campaign.scenario_file southern_syria

name = "southern_syria"
title = "Southern Syria"
description = """A US-led coalition, flying from Jordan and Israel, against Syria. Syria has few,
older fighters and relies on a dense air defence network around Damascus and the south; its army
holds the border. The coalition's ground forces stage in northern Jordan."""
map = "Syria"
magvar = 5.0                 # degrees east; bearings below are magnetic

[area]                       # objectives within this are in play; the rest of the map is outside the war
center = "ab_khalkhalah"
radius_nm = 90

[sides.blue]
name = "Coalition"
countries = ["Jordan", "Israel"]
posture = "attack"           # its ground commander attacks (campaign/ground_war.py)...
goal = "town_damascus"       # ...towards this

[sides.red]
name = "Syria"
countries = ["Syria"]
posture = "defend"           # holds, reinforces, counterattacks
# Everything else in the area (Lebanon, the Golan's Israeli side is Israel's) is neutral.

[owners]                     # hand overrides of who holds an objective at the start
# town_x = "blue"

