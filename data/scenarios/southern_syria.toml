# ---------- ground: placed by hand ----------
# at: an objective id; brg_nm: [magnetic bearing, nm] from it (otherwise at it).
# templates: campaign/templates.py.

# Damascus: SA-2 and SA-3 rings and an SA-11.
[[formations]]
name = "Damascus SAM belt"
side = "red"
at = "town_damascus"
brg_nm = [0, 14]
templates = ["red_sa2"]

[[formations]]
