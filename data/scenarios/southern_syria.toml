# Coalition ground forces staging in northern Jordan, and Hawks at the forward bases.
# The coalition's ground forces: three US brigade combat teams on the Jordanian border, an
# Israeli armoured brigade on the Golan. Fewer than Syria's, but much better (campaign/combat.py).
[[formations]]
name = "1st BCT"
side = "blue"
at = "town_ramtha"
templates = ["blue_tank_bn", "blue_tank_bn", "blue_mech_bn", "blue_art_bn"]

[[formations]]
name = "2nd BCT"
side = "blue"
at = "town_irbid"
templates = ["blue_tank_bn", "blue_mech_bn", "blue_mech_bn", "blue_art_bn"]

[[formations]]
name = "3rd BCT"
side = "blue"
at = "ab_king_hussein_air_college"
templates = ["blue_tank_bn", "blue_tank_bn", "blue_mech_bn", "blue_art_bn"]

[[formations]]
name = "IDF 7th Armoured Brigade"
side = "blue"
at = "town_qiryat_shemona"
templates = ["idf_tank_bn", "idf_tank_bn", "blue_mech_bn", "blue_art_bn"]

[[formations]]
side = "blue"
at = "ab_king_hussein_air_college"
templates = ["blue_hawk"]

[[formations]]
side = "blue"
at = "ab_ramat_david"
