# ---------- ground: rules for the routine placements ----------

[rules]
military_sites = true        # every red military site gets formations by its name (scenario_file.SITE_RULES)
airbase_defence = { red = ["red_sa8", "red_aaa"], blue = ["blue_avenger"] }
city_defence = { red = { min_priority = 3, templates = ["red_aaa"] } }
