# Campaign server settings. Distances in nautical miles, times in seconds.

[server]
host = "127.0.0.1"        # the bridge listens here; run the engine on the DCS server machine
port = 7341               # must match the mission bridge and Hooks scripts
save = "build/saves/campaign.json"   # loaded at startup, written while running and on stop
autosave_s = 30           # save this often (real time) while anything changes
status_s = 60             # print a status line this often (real time)
slot_sides = [0, 2]       # sides players may take: 0 spectators, 1 red, 2 blue (PvE: blue only)

[bubble]
# Ordinary ground formations exist in DCS while a player is within these distances.
# They spawn inside ground_spawn_nm and despawn only once every player is beyond
# ground_despawn_nm (must be >= the spawn distance; the gap stops flicker at the edge).
ground_spawn_nm = 20
ground_despawn_nm = 25

# Town and airbase garrisons (mostly infantry, one per town) use smaller distances, so they
# don't fill the max_units budget ahead of the formations.
garrison_spawn_nm = 8
garrison_despawn_nm = 10

# Air defences use their missile range plus these margins (or the ground distances, if larger),
# so a site is up before anyone can enter its envelope. E.g. an SA-6 (11.9 nm) spawns at 21.9 nm.
sam_spawn_margin_nm = 10
sam_despawn_margin_nm = 15

min_dwell_s = 90          # a fresh spawn stays at least this long
max_units = 300           # live campaign ground vehicles in DCS
max_spawns_per_tick = 4   # spread spawns out to avoid frame hitches
lookahead_s = 60          # also spawn around where each player will be this far ahead

# AI flights exist in DCS while a player is within these distances (or a ramp start's base is);
# beyond them they fly their routes in the engine only.
air_spawn_nm = 60
air_despawn_nm = 80
air_min_dwell_s = 120     # a flight spawned in DCS stays at least this long
max_flights = 12          # campaign AI flights in DCS at once
